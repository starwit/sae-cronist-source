log_level: INFO
# Id this SAE reports to cronist as
sae_id: sae-1
# Output stream suffix and VideoFrame.source_id
stream_id: stream1
cronist:
  base_url: http://localhost:8081/cronist
  sync_interval: 2.0
  request_timeout: 5.0
  # Only needed if cronist runs with the `auth` profile
  # auth:
  #   token_url: http://localhost:8080/realms/cronist/protocol/openid-connect/token
  #   client_id: sae
  #   client_secret: secret
redis:
  host: redis
  port: 6379
  output_stream_prefix: cronistsource
  stream_maxlen: 200
  reset_stream_on_task_start: true
  backpressure:
    # threshold: 100   # defaults to stream_maxlen / 2
    fail_open_timeout: 30.0
    monitor_interval: 0.05
    consumer_idle_timeout_ms: 10000
source:
  # target_fps: 10
  encoding:
    jpeg_quality: 90
    scale_width: 0
  # download_dir: /tmp
  download_timeout: 30.0
prometheus_port: 8000
