[tool.poetry]
name = "cronistsource"
version = "0.1.0"
description = ""
authors = ["flonix8 <flstanek@googlemail.com>"]
license = "AGPLv3"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "2.13.5"
visionapi = { git = "https://github.com/starwit/vision-api.git", subdirectory = "python/visionapi", tag = "3.8.0" }
visionlib = { git = "https://github.com/starwit/vision-lib.git", subdirectory = "python", tag = "1.1.0" }
pydantic-settings = "2.15.0"
prometheus-client = "0.26.0"
# PyAV ships manylinux wheels with bundled ffmpeg, so no ffmpeg system packages are needed
av = "18.0.0"
numpy = ">=1.24.0"
# Must stay <2.0: 2.x requires libjpeg-turbo 3.x, which is not available on Ubuntu 24.04 LTS
pyturbojpeg = "1.8.3"
# For the cronist REST API and video downloads
requests = "^2.32"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
