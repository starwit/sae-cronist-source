name: Create Release

on:
  workflow_dispatch:
    inputs:
      versionChoice:
        type: choice
        required: true
        description: Version Change
        options:
        - patch
        - minor
        - major

permissions:
  contents: write

env:
  IMAGE_NAME: sae-cronist-source
  DOCKERHUB_USERNAME: starwit
  DOCKERHUB_ORG: starwitorg 

jobs:
  create-release:
    name: create new release
    runs-on: [self-hosted, linux, X64]
    outputs:
      version: ${{ steps.release.outputs.version }}
    container:
      image: starwitorg/debian-packaging:0.0.3
      volumes:
        - /home/githubrunner/.cache/pypoetry:/root/.cache/pypoetry
      env:
        PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD_FLAT }}
        GPG_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY_B64 }}

    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1        
        
      - name: create new version in pyproject.toml
        run: |
          poetry version $VERSION
        env:
          VERSION: ${{ inputs.versionChoice }}

      - name: commit new version
        run: |
          git config --global user.email "code@starwit.de"
          git config --global user.name "Starwit"
          git remote set-url --push origin https://Starwit:$GITHUB_TOKEN@github.com/starwit/${{ env.IMAGE_NAME }}.git
          git add .
          modifications=$(git status | grep "modified" || true)
          if [ ! -z "$modifications" ]
          then
            echo "modifications found: $modifications"
            git commit -m "modified project version" ./pyproject.toml
            git push
          fi 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create github release
        id: release
        run: | 
          APP_VERSION=$(poetry version -s)
          gh release create $APP_VERSION -F README.md --title "${APP_VERSION}" --target $(git rev-parse HEAD)
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_docker:
    name: "Build and publish docker"
    needs: create-release
    runs-on: [self-hosted, linux, X64]
    env:
      APP_VERSION: ${{ needs.create-release.outputs.version }}
    
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.APP_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          sbom: true
          provenance: mode=max
          push: true
          tags: ${{ env.DOCKERHUB_ORG }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          
  publish_helm:
    name: "Publish helm chart"
    needs: create-release
    runs-on: [self-hosted, linux, X64]
    env:
      APP_VERSION: ${{ needs.create-release.outputs.version }}

    steps:
    - name: Checkout release tag
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ env.APP_VERSION }}

    - name: get helm
      uses: azure/setup-helm@v4

    - name: run helm package
      working-directory: deployment/helm
      run: helm package . --version $APP_VERSION --app-version $APP_VERSION

    - name: login to Helm registry
      run: helm registry login registry-1.docker.io -u ${{ env.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

    - name: run helm push
      working-directory: deployment/helm
      run: helm push ${{ env.IMAGE_NAME }}-chart-$APP_VERSION.tgz oci://registry-1.docker.io/${{ env.DOCKERHUB_ORG }}
